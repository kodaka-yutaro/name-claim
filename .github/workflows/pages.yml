name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html about.html privacy.html app.js i18n.js town.js config.js style.css icon.png og.png robots.txt sitemap.xml CNAME _site/
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
      - name: Make browsers fetch fresh files after each deploy
        run: sed -i -E "s#(href|src)=\"(style\.css|config\.js|i18n\.js|town\.js|app\.js)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
